plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.takirastreadores.field'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.takirastreadores.field'
        minSdk 26
        targetSdk 35
        versionCode 11
        versionName '7.0.3'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
}
