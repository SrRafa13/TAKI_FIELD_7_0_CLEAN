name: Build TAKI FIELD 7.0.1

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout clean repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compile TAKI FIELD 7.0.1
        shell: bash
        run: gradle clean assembleDebug --stacktrace

      - name: Prepare final APK
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TAKI_FIELD_v7.0.1.apk
          sha256sum TAKI_FIELD_v7.0.1.apk
          unzip -t TAKI_FIELD_v7.0.1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TAKI-FIELD-APK-v7.0.1
          path: TAKI_FIELD_v7.0.1.apk
          if-no-files-found: error
          retention-days: 30
